name: Build and Upload Student Application

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: application

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Verify Java Version
        run: java -version

      - name: Build Code with Maven
        run: mvn clean package

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # FIX: Hardcoded region (or keep using your secret variable)

      # FIX: Use wildcard (*.war) to upload the file as ROOT.war to your S3 bucket
      - name: Upload WAR to S3
        run: |
          aws s3 cp target/*.war s3://project5warfile/ROOT.war

      - name: Verify Upload
        run: |
          aws s3 ls s3://project5warfile/
